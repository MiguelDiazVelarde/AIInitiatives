name: 🔧 Debug - Ultra Simple Test

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  debug:
    name: 🔬 Ultra Simple Debug
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4

    - name: 🔧 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: 📦 Install
      run: npm ci

    - name: 🏗️ Build
      run: npm run build

    - name: ✅ Success
      run: echo "✅ Ultra simple test completed successfully!"