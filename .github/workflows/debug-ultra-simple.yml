name: 🔧 Debug - Ultra Simple Test

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  debug:
    name: 🔬 Ultra Simple Debug
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v4

    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10

    - name: 🔧 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'pnpm'

    - name: 📦 Install
      run: pnpm install --frozen-lockfile

    - name: 🏗️ Build
      run: pnpm run build

    - name: ✅ Success
      run: echo "✅ Ultra simple test completed successfully!"