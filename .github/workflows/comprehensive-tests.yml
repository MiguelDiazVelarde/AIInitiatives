name: Simple Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Type of tests to run'
        required: true
        default: 'smoke'
        type: choice
        options:
        - smoke
        - auth
        - all

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25  # Increased to accommodate 63 test scenarios
    
    steps:
    - name: 🛎️ Checkout Repository
      uses: actions/checkout@v4
        
    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24.x'
        cache: 'npm'
        
    - name: 📦 Install Dependencies
      run: npm ci
        
    - name: 🔧 Build Application
      run: npm run build
        
    - name: 🎭 Install Playwright Browsers
      run: npx playwright install chromium --with-deps
        
    - name: 🚀 Start Server
      env:
        NODE_ENV: test
        PORT: 3000
      run: |
        npm start &
        SERVER_PID=$!
        echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
        sleep 5
        
    - name: ⏳ Wait for Server
      run: |
        timeout=30
        counter=0
        while [ $counter -lt $timeout ]; do
          if curl -f http://localhost:3000/api/health >/dev/null 2>&1; then
            echo "✅ Server ready!"
            break
          fi
          sleep 2
          counter=$((counter+2))
        done
        
    - name: 🧪 Run Tests
      run: |
        case "${{ github.event.inputs.test_type || 'smoke' }}" in
          "auth")
            npm run test:auth
            ;;
          "all")
            npm run test:full
            ;;
          *)
            npm run test:smoke
            ;;
        esac
        
    - name: 🤖 Run AI Test Optimizer
      if: ${{ github.event.inputs.test_type == 'all' }}
      run: npm run optimizer:quick
        
    - name: 🧹 Cleanup
      if: always()
      run: |
        if [ ! -z "$SERVER_PID" ]; then
          kill $SERVER_PID 2>/dev/null || true
        fi
        pkill -f "node.*dist/server" 2>/dev/null || true
        
    - name: 📋 Upload Reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: |
          reports/
          test-optimizer-reports/
        retention-days: 3

  security:
    runs-on: ubuntu-latest
    steps:
    - name: 🛎️ Checkout
      uses: actions/checkout@v4
      
    - name: 🟢 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24.x'
        cache: 'npm'
        
    - name: 📦 Install Dependencies
      run: npm ci
      
    - name: 🔒 Security Audit
      run: npm audit --audit-level high