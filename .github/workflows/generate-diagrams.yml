name: Generate PlantUML Diagrams

on:
  push:
    paths:
      - 'docs/diagrams/*.puml'
  workflow_dispatch:

jobs:
  generate-diagrams:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Install PlantUML
      run: |
        sudo apt-get update
        sudo apt-get install -y graphviz
        wget https://github.com/plantuml/plantuml/releases/download/v1.2024.7/plantuml-1.2024.7.jar -O plantuml.jar
        
    - name: Generate PNG from PlantUML
      run: |
        java -jar plantuml.jar -tpng docs/diagrams/*.puml
        ls -la docs/diagrams/
        
    - name: Commit generated images
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add docs/diagrams/*.png
        git diff --quiet && git diff --staged --quiet || git commit -m "docs: auto-generate PlantUML diagrams [skip ci]"
        
    - name: Push changes
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        branch: ${{ github.ref }}
