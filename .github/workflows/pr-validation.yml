name: 🔍 Simple PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ main ]

jobs:
  basic-validation:
    name: 📝 Basic Validation
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ github.event.pull_request.head.sha }}

    - name: 🔧 Setup Git references
      run: |
        echo "Setting up Git references..."
        git fetch origin main:main || echo "Main branch fetch failed"
        git branch -a
        echo "Current HEAD: $(git rev-parse HEAD)"
        echo "Main ref: $(git rev-parse origin/main 2>/dev/null || echo 'not found')"

    - name: 🔧 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: 📦 Install root dependencies
      run: npm ci

    - name: 📦 Install client dependencies  
      run: |
        cd client
        npm ci

    - name: 🎭 Pre-install Playwright browsers
      run: |
        echo "🎭 Installing Playwright browsers immediately after dependencies..."
        # This ensures browsers are installed with the exact same Playwright version as dependencies
        npx playwright install --with-deps
        echo "✅ Browsers pre-installed"

    - name: 🏗️ Build server
      run: npm run build:server

    - name: 🏗️ Build client
      run: npm run build:client

    - name: 🎭 Install Playwright browsers
      run: |
        echo "Installing Playwright browsers..."
        
        # First ensure we have the latest Playwright
        echo "📦 Ensuring Playwright is up to date..."
        npm ls @playwright/test || echo "Playwright not found in dependencies"
        
        # Force reinstall browsers to ensure clean state
        echo "🧹 Cleaning browser cache..."
        rm -rf ~/.cache/ms-playwright/ || echo "No cache to clean"
        
        # Install browsers with verbose output
        echo "🎭 Installing all Playwright browsers..."
        npx playwright install --with-deps
        
        # Verify installation
        echo "🔍 Verifying Playwright installation..."
        npx playwright --version
        
        # Check what browsers were actually installed
        echo "📂 Checking installed browsers:"
        ls -la ~/.cache/ms-playwright/ || echo "No browser cache found"
        find ~/.cache/ms-playwright/ -type d -name "*chromium*" | head -5
        
        # Test browser availability
        echo "🧪 Testing browser executables..."
        find ~/.cache/ms-playwright/ -name "*chrome*" -type f -executable | head -3 || echo "No chrome executables found"
        find ~/.cache/ms-playwright/ -name "*headless*" -type f -executable | head -3 || echo "No headless executables found"
        
        # Ensure all dependencies are properly installed
        echo "🔗 Ensuring Playwright dependencies are linked..."
        npm ls @playwright/test
        
        # Force a browser recheck
        echo "🔄 Running Playwright browser check..."
        npx playwright install --dry-run || echo "Dry run completed"

    - name: 🧪 Test Playwright Setup
      run: |
        echo "🔍 Testing Playwright browser functionality..."
        
        # Create a test that matches exactly what Cucumber is trying to do
        cat > test-playwright-cucumber.js << 'EOF'
        const { chromium } = require('@playwright/test');
        
        (async () => {
          try {
            console.log('🚀 Testing Playwright browser launch (matching Cucumber setup)...');
            
            // Use exact same options as Cucumber hooks
            const launchOptions = {
              headless: process.env.HEADLESS !== 'false',
              args: [
                '--no-sandbox', 
                '--disable-dev-shm-usage',
                '--disable-gpu',
                '--disable-web-security',
                '--disable-background-timer-throttling',
                '--disable-backgrounding-occluded-windows',
                '--disable-renderer-backgrounding'
              ]
            };
            
            console.log('🎭 Launching browser with options:', JSON.stringify(launchOptions, null, 2));
            
            const browser = await chromium.launch(launchOptions);
            console.log('✅ Browser launched successfully');
            
            const context = await browser.newContext({
              viewport: { width: 1280, height: 720 },
              ignoreHTTPSErrors: true
            });
            console.log('✅ Context created successfully');
            
            const page = await context.newPage();
            console.log('✅ Page created successfully');
            
            // Test page navigation
            await page.goto('about:blank');
            console.log('✅ Page navigation successful');
            
            await context.close();
            await browser.close();
            console.log('✅ Playwright test completed successfully - Cucumber should work!');
            process.exit(0);
          } catch (error) {
            console.error('❌ Playwright test failed:', error.message);
            console.error('🔍 Full error:', error);
            
            // Try to provide specific debugging for browser executable issues
            if (error.message.includes("Executable doesn't exist")) {
              console.error('🚨 Browser executable path issue detected!');
              console.error('💡 This usually means browser installation failed or version mismatch');
              
              // Check what browsers are actually available
              const fs = require('fs');
              const path = require('path');
              const os = require('os');
              
              const cacheDir = path.join(os.homedir(), '.cache', 'ms-playwright');
              console.error('🔍 Checking browser cache at:', cacheDir);
              
              try {
                if (fs.existsSync(cacheDir)) {
                  const contents = fs.readdirSync(cacheDir);
                  console.error('📂 Cache contents:', contents);
                } else {
                  console.error('❌ Browser cache directory does not exist');
                }
              } catch (e) {
                console.error('❌ Failed to read cache directory:', e.message);
              }
            }
            
            process.exit(1);
          }
        })();
        EOF
        
        # Run the test
        echo "🧪 Running Playwright functionality test..."
        node test-playwright-cucumber.js
        
        # Clean up
        rm test-playwright-cucumber.js
        
        echo "✅ Playwright setup verification completed"

    - name: ✅ Verify builds
      run: |
        echo "Checking build outputs..."
        ls -la dist/server/ || echo "Server build directory not found"
        ls -la client/dist/ || echo "Client build directory not found"
        
        if [ -f "dist/server/index.js" ]; then
          echo "✅ Server build successful"
        else
          echo "❌ Server build failed"
          exit 1
        fi
        
        if [ -f "client/dist/index.html" ]; then
          echo "✅ Client build successful"
        else
          echo "❌ Client build failed"
          exit 1
        fi

    - name: 🚀 Quick server test
      continue-on-error: true
      run: |
        echo "Testing server startup..."
        
        # Start server in background
        node dist/server/index.js &
        SERVER_PID=$!
        echo "Server started with PID: $SERVER_PID"
        
        # Wait a bit
        sleep 5
        
        # Try to connect
        if curl -f --max-time 5 http://localhost:3000/api/health 2>/dev/null; then
          echo "✅ Server is responding"
        else
          echo "⚠️ Server test skipped (health endpoint may not exist)"
        fi
        
        # Cleanup
        kill $SERVER_PID 2>/dev/null || true
        echo "Server test completed"

    - name: 🚀 Start server for testing
      run: |
        echo "Starting server for tests..."
        
        # Check if port 3000 is already in use
        if lsof -Pi :3000 -sTCP:LISTEN -t >/dev/null 2>&1; then
          echo "⚠️ Port 3000 is already in use, killing existing process..."
          pkill -f "node.*dist/server" 2>/dev/null || true
          sleep 2
        fi
        
        # Verify server build exists
        if [ ! -f "dist/server/index.js" ]; then
          echo "❌ Server build not found at dist/server/index.js"
          exit 1
        fi
        
        echo "📁 Starting server from: $(pwd)/dist/server/index.js"
        
        # Start server with explicit logging
        node dist/server/index.js > server.log 2>&1 &
        SERVER_PID=$!
        echo $SERVER_PID > server.pid
        echo "Server started with PID: $SERVER_PID"
        
        # Wait longer for server startup
        echo "Server started, waiting for it to be ready..."
        sleep 10
        
        # Check server log for any startup errors
        echo "📋 Server startup log:"
        head -20 server.log || echo "No log file found"
        
        # Check if process is still running
        if ! kill -0 $SERVER_PID 2>/dev/null; then
          echo "❌ Server process died during startup"
          echo "Full server log:"
          cat server.log || echo "No log file found"
          exit 1
        fi
        
        # Verify server is responding
        echo "Checking if server is ready..."
        for i in {1..15}; do
          # Try different endpoints to check server health
          if curl -s --max-time 5 http://localhost:3000 >/dev/null 2>&1; then
            echo "✅ Server is ready and responding on port 3000"
            break
          elif curl -s --max-time 5 http://localhost:3000/api/health >/dev/null 2>&1; then
            echo "✅ Server health endpoint responding"
            break
          elif curl -s --max-time 5 http://localhost:3000/api >/dev/null 2>&1; then
            echo "✅ Server API endpoint responding"
            break
          else
            echo "⏳ Waiting for server... (attempt $i/15)"
            if [ $i -eq 15 ]; then
              echo "❌ Server failed to respond after 15 attempts"
              echo "🔍 Testing server response manually:"
              echo "Response from localhost:3000:"
              curl -v http://localhost:3000 2>&1 | head -10 || echo "Curl failed"
              echo "Response from localhost:3000/api:"
              curl -v http://localhost:3000/api 2>&1 | head -10 || echo "API curl failed"
              echo "Final server log:"
              cat server.log || echo "No log file found"
              echo "Checking what's listening on port 3000:"
              lsof -i :3000 || echo "Nothing listening on port 3000"
              # Don't exit - server is running, just continue with tests
              echo "⚠️ Server seems to be running but not responding to health checks, continuing with tests..."
              break
            fi
            sleep 3
          fi
        done

    - name: 🧪 Execute AI-Optimized Tests
      run: |
        echo "🤖 Executing AI-optimized test suite..."
        
        # First, run AI analysis
        echo "🔍 Running AI Test Optimizer for PR changes..."
        CHANGED_FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }})
        echo "📁 Files changed in this PR: $CHANGED_FILES"
        
        # Generate optimization plan
        echo "🧠 Generating optimization plan..."
        if npx ts-node src/test-optimizer/index.ts optimize balanced; then
          echo "✅ PR optimization plan generated"
        else
          echo "⚠️ PR analysis failed - will use fallback"
        fi
        
        # Generate recommendations
        echo "💡 Generating test recommendations..."
        # Use a simpler approach that doesn't rely on git diff main..HEAD
        if npx ts-node src/test-optimizer/index.ts optimize balanced; then
          echo "✅ Recommendations generated using optimization strategy"
        else
          echo "⚠️ Recommendations failed - will continue with fallback"
        fi
        
        # Verify Playwright is working
        echo "🔍 Verifying Playwright setup..."
        if npx playwright --version; then
          echo "✅ Playwright CLI is available"
        else
          echo "❌ Playwright CLI not working"
        fi
        
        # Try to execute optimized tests first
        echo "🚀 Executing optimized test suite..."
        if npx ts-node src/test-optimizer/index.ts execute; then
          echo "✅ AI-optimized tests completed successfully"
        else
          echo "⚠️ AI-optimized execution failed, falling back to smoke tests"
          echo "🔥 Running fallback smoke tests..."
          npm run test:smoke
        fi

    - name: 🛑 Stop server
      if: always()
      run: |
        echo "🛑 Stopping server and cleaning up..."
        
        if [ -f "server.pid" ]; then
          SERVER_PID=$(cat server.pid)
          echo "Stopping server with PID: $SERVER_PID"
          kill $SERVER_PID 2>/dev/null || true
          rm server.pid
        fi
        
        # Kill any remaining node processes
        pkill -f "node.*dist/server" 2>/dev/null || true
        
        # Show final server log if available
        if [ -f "server.log" ]; then
          echo "📋 Final server log (last 10 lines):"
          tail -10 server.log
          rm server.log
        fi
        
        echo "Server stopped and cleaned up"

    - name: ✅ PR validation complete
      run: echo "✅ PR validation completed successfully"