name: 🔍 Simple PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ main ]

jobs:
  basic-validation:
    name: 📝 Basic Validation
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ github.event.pull_request.head.sha }}

    - name: 🔧 Setup Git references
      run: |
        echo "Setting up Git references..."
        git fetch origin main:main || echo "Main branch fetch failed"
        git branch -a
        echo "Current HEAD: $(git rev-parse HEAD)"
        echo "Main ref: $(git rev-parse origin/main 2>/dev/null || echo 'not found')"

    - name: 🔧 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: 📦 Install root dependencies
      run: npm ci

    - name: 📦 Install client dependencies  
      run: |
        cd client
        npm ci

    - name: 🏗️ Build server
      run: npm run build:server

    - name: 🏗️ Build client
      run: npm run build:client

    - name: 🎭 Install Playwright browsers
      run: |
        echo "Installing Playwright browsers..."
        npx playwright install chromium firefox webkit
        npx playwright install-deps
        
        # Verify installation
        echo "Verifying Playwright installation..."
        npx playwright --version || echo "Playwright CLI not available"
        ls -la ~/.cache/ms-playwright/ || echo "Playwright cache not found"

    - name: ✅ Verify builds
      run: |
        echo "Checking build outputs..."
        ls -la dist/server/ || echo "Server build directory not found"
        ls -la client/dist/ || echo "Client build directory not found"
        
        if [ -f "dist/server/index.js" ]; then
          echo "✅ Server build successful"
        else
          echo "❌ Server build failed"
          exit 1
        fi
        
        if [ -f "client/dist/index.html" ]; then
          echo "✅ Client build successful"
        else
          echo "❌ Client build failed"
          exit 1
        fi

    - name: 🚀 Quick server test
      continue-on-error: true
      run: |
        echo "Testing server startup..."
        
        # Start server in background
        node dist/server/index.js &
        SERVER_PID=$!
        echo "Server started with PID: $SERVER_PID"
        
        # Wait a bit
        sleep 5
        
        # Try to connect
        if curl -f --max-time 5 http://localhost:3000/api/health 2>/dev/null; then
          echo "✅ Server is responding"
        else
          echo "⚠️ Server test skipped (health endpoint may not exist)"
        fi
        
        # Cleanup
        kill $SERVER_PID 2>/dev/null || true
        echo "Server test completed"

    - name: 🚀 Start server for testing
      run: |
        echo "Starting server for tests..."
        npm start &
        echo $! > server.pid
        echo "Server started, waiting for it to be ready..."
        sleep 15
        
        # Verify server is responding
        echo "Checking if server is ready..."
        for i in {1..10}; do
          if curl -f --max-time 5 http://localhost:3000 >/dev/null 2>&1; then
            echo "✅ Server is ready and responding"
            break
          else
            echo "⏳ Waiting for server... (attempt $i/10)"
            sleep 3
          fi
        done

    - name: 🧪 Execute AI-Optimized Tests
      run: |
        echo "🤖 Executing AI-optimized test suite..."
        
        # First, run AI analysis
        echo "🔍 Running AI Test Optimizer for PR changes..."
        CHANGED_FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }})
        echo "📁 Files changed in this PR: $CHANGED_FILES"
        
        # Generate optimization plan
        echo "🧠 Generating optimization plan..."
        if npx ts-node src/test-optimizer/index.ts optimize balanced; then
          echo "✅ PR optimization plan generated"
        else
          echo "⚠️ PR analysis failed - will use fallback"
        fi
        
        # Generate recommendations
        echo "💡 Generating test recommendations..."
        # Use a simpler approach that doesn't rely on git diff main..HEAD
        if npx ts-node src/test-optimizer/index.ts optimize balanced; then
          echo "✅ Recommendations generated using optimization strategy"
        else
          echo "⚠️ Recommendations failed - will continue with fallback"
        fi
        
        # Verify Playwright is working
        echo "🔍 Verifying Playwright setup..."
        if npx playwright --version; then
          echo "✅ Playwright CLI is available"
        else
          echo "❌ Playwright CLI not working"
        fi
        
        # Try to execute optimized tests first
        echo "🚀 Executing optimized test suite..."
        if npx ts-node src/test-optimizer/index.ts execute; then
          echo "✅ AI-optimized tests completed successfully"
        else
          echo "⚠️ AI-optimized execution failed, falling back to smoke tests"
          echo "🔥 Running fallback smoke tests..."
          npm run test:smoke
        fi

    - name: 🛑 Stop server
      if: always()
      run: |
        if [ -f "server.pid" ]; then
          SERVER_PID=$(cat server.pid)
          echo "Stopping server with PID: $SERVER_PID"
          kill $SERVER_PID 2>/dev/null || true
          rm server.pid
        fi
        pkill -f "node.*dist/server" 2>/dev/null || true
        echo "Server stopped"

    - name: ✅ PR validation complete
      run: echo "✅ PR validation completed successfully"