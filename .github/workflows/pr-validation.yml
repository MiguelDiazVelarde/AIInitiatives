name: Pull Request Validation

# Add permissions for the workflow
permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ main ]

jobs:
  pr-validation:
    name: Validate Pull Request
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch full history for better analysis
        
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Install client dependencies
      run: |
        cd client
        npm ci
      
    - name: Check PR title and description
      uses: actions/github-script@v7
      with:
        script: |
          const pr = context.payload.pull_request;
          
          // Check PR title
          const title = pr.title;
          if (title.length < 10) {
            core.setFailed('PR title should be at least 10 characters long');
            return;
          }
          
          // Check if PR has description
          const body = pr.body || '';
          if (body.length < 20) {
            core.setFailed('PR description should be at least 20 characters long');
            return;
          }
          
          console.log('✅ PR title and description are valid');
          
    - name: Check for TypeScript compilation errors
      run: |
        npm run build
        echo "✅ TypeScript compilation successful"
        
    - name: 🤖 Run Smart Smoke Tests (AI-Optimized)
      continue-on-error: true
      run: |
        echo "Attempting to run AI-optimized smoke tests..."
        if npm run optimizer:smoke; then
          echo "✅ Smart smoke tests completed successfully"
        else
          echo "⚠️ AI-optimized smoke tests failed - continuing with standard validation"
          echo "   This does not affect PR approval - standard tests will still run"
        fi
        
    - name: 📊 Get Test Recommendations for Changes
      continue-on-error: true
      run: |
        echo "Attempting to analyze code changes..."
        if npx ts-node src/test-optimizer/index.ts recommendations ${{ github.event.pull_request.head.sha }}; then
          echo "✅ Test recommendations generated successfully"
        else
          echo "⚠️ Could not generate test recommendations - this is not critical"
        fi
        
    - name: 🧪 Run Essential Cucumber Tests
      run: |
        echo "Starting backend server for essential tests..."
        npm start &
        SERVER_PID=$!
        echo $SERVER_PID > essential_test_server.pid
        
        # Wait for server to be ready
        echo "Waiting for server to be ready..."
        for i in {1..30}; do
          if curl -f http://localhost:3000/api/health; then
            echo "✅ Server is ready for essential testing!"
            break
          fi
          echo "Waiting for server... attempt $i/30"
          sleep 2
        done
        
        # Run essential Cucumber tests
        echo "Running essential Cucumber tests for PR validation..."
        npm run test:auth || TEST_FAILED=true
        
        # Stop test server
        if [ -f essential_test_server.pid ]; then
          ESSENTIAL_TEST_SERVER_PID=$(cat essential_test_server.pid)
          echo "Stopping essential test server with PID: $ESSENTIAL_TEST_SERVER_PID"
          kill $ESSENTIAL_TEST_SERVER_PID || true
          rm essential_test_server.pid
        fi
        
        # Check if tests failed
        if [ "$TEST_FAILED" = "true" ]; then
          echo "❌ Essential Cucumber tests failed"
          exit 1
        else
          echo "✅ Essential Cucumber tests completed successfully"
        fi
        
    - name: Quick application startup test
      run: |
        # Start backend in background
        npm start &
        SERVER_PID=$!
        echo $SERVER_PID > app.pid
        echo "Started server with PID: $SERVER_PID"
        
        # Wait for server with health check
        echo "Waiting for application to start..."
        for i in {1..30}; do
          if curl -f http://localhost:3000/api/health; then
            echo "✅ Application is running and healthy!"
            break
          fi
          echo "Waiting for application... attempt $i/30"
          sleep 2
        done
        
        # Final verification
        curl -f http://localhost:3000/api/health || exit 1
        
        # Stop app
        kill $SERVER_PID || true
        rm app.pid
        
        echo "✅ Application startup test completed"
        
    - name: Check for sensitive information
      run: |
        # Check for common sensitive patterns
        echo "🔍 Checking for sensitive information..."
        
        # Create a more sophisticated check for hardcoded credentials
        # This script will check for actual hardcoded values, not legitimate code patterns
        
        # Check for hardcoded passwords (actual string values, not variable names)
        SUSPICIOUS_PATTERNS=$(grep -r -E "(password|secret|token)\s*[:=]\s*['\"][a-zA-Z0-9!@#$%^&*()_+=-]{8,}['\"]" src/ --include="*.ts" --include="*.js" | \
          grep -v "// " | \
          grep -v "/\*" | \
          grep -v "passwordHash" | \
          grep -v "req\.body" | \
          grep -v "process\.env" | \
          grep -v "const.*{" | \
          grep -v "interface" | \
          grep -v "type " | \
          grep -v "= req\." | \
          grep -v "= body\." || true)
        
        if [ ! -z "$SUSPICIOUS_PATTERNS" ]; then
          echo "⚠️ Potential hardcoded credentials found:"
          echo "$SUSPICIOUS_PATTERNS"
          echo ""
          echo "Please review these patterns. If they are legitimate, consider:"
          echo "1. Using environment variables (process.env.PASSWORD)"
          echo "2. Using a configuration file"
          echo "3. Adding comments to explain the usage"
          exit 1
        fi
        
        # Check for suspicious API key patterns
        API_KEYS=$(grep -r -E "(api_key|apikey|access_token)\s*[:=]\s*['\"][a-zA-Z0-9_-]{16,}['\"]" src/ --include="*.ts" --include="*.js" | \
          grep -v "// " | \
          grep -v "process\.env" | \
          grep -v "interface" | \
          grep -v "type " || true)
        
        if [ ! -z "$API_KEYS" ]; then
          echo "⚠️ Potential hardcoded API keys found:"
          echo "$API_KEYS"
          exit 1
        fi
        
        echo "✅ No sensitive information detected"
        
    - name: Generate PR summary
      uses: actions/github-script@v7
      if: always()
      with:
        script: |
          const fs = require('fs');
          
          let summary = '## 🔍 Pull Request Validation Summary\n\n';
          
          // Get changed files
          const { data: files } = await github.rest.pulls.listFiles({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: context.issue.number
          });
          
          summary += `### 📁 Files Changed (${files.length})\n`;
          files.forEach(file => {
            const status = file.status === 'added' ? '🆕' : 
                          file.status === 'modified' ? '✏️' : 
                          file.status === 'removed' ? '🗑️' : '📝';
            summary += `- ${status} \`${file.filename}\` (+${file.additions}/-${file.deletions})\n`;
          });
          
          summary += '\n### ✅ Validation Checks\n';
          summary += '- ✅ PR title and description validated\n';
          summary += '- ✅ TypeScript compilation successful\n';
          summary += '- ✅ Application startup verified\n';
          summary += '- ✅ Basic health checks passed\n';
          summary += '- ✅ Security scan completed\n';
          
          summary += '\n### 🚀 Next Steps\n';
          summary += 'This PR is ready for code review. The automated tests will run when a maintainer approves the workflow.\n';
          
          try {
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });
            console.log('✅ Successfully posted PR summary comment');
          } catch (error) {
            console.log('⚠️ Failed to post comment:', error.message);
          }

  # Job to check if tests need approval (for external contributors)
  check-approval:
    name: Check Test Approval
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name != github.repository
    
    steps:
    - name: Comment about test approval
      uses: actions/github-script@v7
      with:
        script: |
          const comment = `## 🔒 External Contribution Detected
          
          This pull request is from an external contributor. A maintainer needs to approve running the tests for security reasons.
          
          **Maintainers**: If this PR looks safe, comment \`/approve-tests\` to run the full test suite.
          
          ### Quick Safety Checklist:
          - [ ] PR description explains the changes
          - [ ] No suspicious file modifications
          - [ ] No addition of external dependencies without justification
          - [ ] Changes look reasonable and safe
          `;
          
          try {
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
            console.log('✅ Successfully posted external contributor notice');
          } catch (error) {
            console.log('⚠️ Failed to post comment:', error.message);
          }