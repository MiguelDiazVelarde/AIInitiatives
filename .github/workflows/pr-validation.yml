name: 🔍 Simple PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ main ]

jobs:
  basic-validation:
    name: 📝 Basic Validation
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🔧 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: 📦 Install root dependencies
      run: npm ci

    - name: 📦 Install client dependencies  
      run: |
        cd client
        npm ci

    - name: 🏗️ Build server
      run: npm run build:server

    - name: �️ Build client
      run: npm run build:client

    - name: ✅ Verify builds
      run: |
        echo "Checking build outputs..."
        ls -la dist/server/ || echo "Server build directory not found"
        ls -la client/dist/ || echo "Client build directory not found"
        
        if [ -f "dist/server/index.js" ]; then
          echo "✅ Server build successful"
        else
          echo "❌ Server build failed"
          exit 1
        fi
        
        if [ -f "client/dist/index.html" ]; then
          echo "✅ Client build successful"
        else
          echo "❌ Client build failed"
          exit 1
        fi

    - name: 🚀 Quick server test
      continue-on-error: true
      run: |
        echo "Testing server startup..."
        
        # Start server in background
        node dist/server/index.js &
        SERVER_PID=$!
        echo "Server started with PID: $SERVER_PID"
        
        # Wait a bit
        sleep 5
        
        # Try to connect
        if curl -f --max-time 5 http://localhost:3000/api/health 2>/dev/null; then
          echo "✅ Server is responding"
        else
          echo "⚠️ Server test skipped (health endpoint may not exist)"
        fi
        
        # Cleanup
        kill $SERVER_PID 2>/dev/null || true
        echo "Server test completed"

    - name: ✅ PR validation complete
      run: echo "✅ PR validation completed successfully"