name: CI/CD Pipeline

# Add permissions for the workflow
permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write

on:
  # Trigger on pull requests to main branch
  pull_request:
    branches: [ main ]
  # Trigger on pushes to main branch
  push:
    branches: [ main ]
  # Allow manual trigger
  workflow_dispatch:

jobs:
  # Job 1: Build and Test Application
  test-application:
    name: Build and Test Application
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Install client dependencies
      run: |
        cd client
        npm ci
        
    - name: Lint code
      run: |
        # Add linting if you have it configured
        echo "Linting step - add your linting commands here"
        
    - name: Build application
      run: npm run build
      
    - name: 🤖 Initialize Test Optimizer (Optional)
      continue-on-error: true
      run: |
        echo "Attempting to initialize Test Optimizer..."
        if npx ts-node src/test-optimizer/index.ts config show; then
          echo "✅ Test Optimizer initialized successfully"
        else
          echo "⚠️ Test Optimizer initialization failed - continuing with standard tests"
        fi
        
    - name: 🚀 Run Optimized Tests (Quick Strategy)
      continue-on-error: true
      run: |
        echo "Attempting to run optimized tests..."
        if npm run optimizer:quick; then
          echo "✅ Optimized tests completed successfully"
        else
          echo "⚠️ Optimized tests failed - this is not critical for CI"
          echo "   The application will still be tested with standard health checks"
        fi
        
    - name: Start backend server in background
      run: |
        npm start &
        SERVER_PID=$!
        echo $SERVER_PID > app.pid
        echo "Started server with PID: $SERVER_PID"
        
    - name: Wait for server and run health check
      run: |
        # Wait for server to start with retry logic
        echo "Waiting for server to become ready..."
        for i in {1..30}; do
          if curl -f http://localhost:3000/api/health; then
            echo "✅ Server is running and healthy!"
            break
          fi
          echo "Waiting for server... attempt $i/30"
          sleep 2
        done
        
        # Final verification
        curl -f http://localhost:3000/api/health || exit 1
        echo "✅ Health check completed successfully"
        
    - name: Stop application
      if: always()
      run: |
        if [ -f app.pid ]; then
          SERVER_PID=$(cat app.pid)
          echo "Stopping server with PID: $SERVER_PID"
          kill $SERVER_PID || true
          rm app.pid
        fi
        
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.node-version }}
        path: |
          reports/
          test-results/
          test-optimizer-reports/
        retention-days: 7

  # Job 2: Extended Tests (only on PR to main branch)
  extended-tests:
    name: Extended Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    needs: test-application
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Install client dependencies
      run: |
        cd client
        npm ci
        
    - name: Build application
      run: npm run build
      
    - name: 🤖 Run Optimized Tests (Balanced Strategy)
      continue-on-error: true
      run: |
        echo "Attempting to run balanced optimization for PR validation..."
        if npm run optimizer:balanced; then
          echo "✅ Balanced optimization completed successfully"
        else
          echo "⚠️ Balanced optimization failed - continuing with standard validation"
        fi
        
    - name: 📊 Generate Test Optimization Report
      continue-on-error: true
      run: |
        echo "Attempting to generate optimization insights..."
        if npm run optimizer:stats; then
          echo "✅ Optimization stats generated successfully"
        else
          echo "⚠️ Could not generate optimization stats"
        fi
        
    - name: Start backend server
      run: |
        npm start &
        SERVER_PID=$!
        echo $SERVER_PID > app.pid
        echo "Started server with PID: $SERVER_PID"
        
    - name: Run extended health checks
      run: |
        # Wait for server to start with retry logic
        echo "Running extended health checks..."
        for i in {1..30}; do
          if curl -f http://localhost:3000/api/health; then
            echo "✅ Server is running and healthy!"
            break
          fi
          echo "Waiting for server... attempt $i/30"
          sleep 2
        done
        
        # Final verification
        curl -f http://localhost:3000/api/health || exit 1
        echo "✅ Extended health checks completed"
        
    - name: Stop application
      if: always()
      run: |
        if [ -f app.pid ]; then
          SERVER_PID=$(cat app.pid)
          echo "Stopping server with PID: $SERVER_PID"
          kill $SERVER_PID || true
          rm app.pid
        fi
        
    - name: Upload test optimization reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-optimizer-reports-extended
        path: |
          test-optimizer-reports/
          *.json
        retention-days: 7

  # Job 3: Security and Quality Checks
  security-checks:
    name: Security and Quality Checks
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run security audit
      run: npm audit --audit-level high
      
    - name: Check for outdated dependencies
      run: npm outdated || true
      
    - name: License compliance check
      run: |
        npx license-checker --summary || true