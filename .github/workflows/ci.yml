name: CI/CD Pipeline

# Add permissions for the workflow
permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: write

on:
  # Trigger on pull requests to main branch
  pull_request:
    branches: [ main ]
  # Trigger on pushes to main branch
  push:
    branches: [ main ]
  # Allow manual trigger
  workflow_dispatch:

jobs:
  # Job 1: Build and Test Application
  test-application:
    name: Build and Test Application
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    strategy:
      matrix:
        node-version: [20.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Install client dependencies
      run: |
        cd client
        npm ci
        
    - name: Lint code
      run: |
        # Add linting if you have it configured
        echo "Linting step - add your linting commands here"
        
    - name: Build application
      run: npm run build
      
    - name: 🤖 Initialize Test Optimizer (Optional)
      continue-on-error: true
      run: |
        echo "Attempting to initialize Test Optimizer..."
        if npx ts-node src/test-optimizer/index.ts config show; then
          echo "✅ Test Optimizer initialized successfully"
        else
          echo "⚠️ Test Optimizer initialization failed - continuing with standard tests"
        fi
        
    - name: 🚀 Run Optimized Tests (Quick Strategy)
      continue-on-error: true
      run: |
        echo "Attempting to run optimized tests..."
        if npm run optimizer:quick; then
          echo "✅ Optimized tests completed successfully"
        else
          echo "⚠️ Optimized tests failed - this is not critical for CI"
          echo "   The application will still be tested with standard health checks"
        fi
        
    - name: 🧪 Basic Application Test
      env:
        NODE_ENV: test
        PORT: 3001
        TEST_BASE_URL: http://localhost:3001
        HEADLESS: true
      run: |
        echo "Running basic application test..."
        
        # Start server
        npm start &
        SERVER_PID=$!
        echo "Server started with PID: $SERVER_PID"
        
        # Wait for server
        sleep 8
        
        # Basic health check
        if curl -f --max-time 10 http://localhost:3001/api/health; then
          echo "✅ Server health check passed"
        else
          echo "❌ Server health check failed"
          kill $SERVER_PID || true
          exit 1
        fi
        
        # Test homepage
        if curl -f --max-time 10 http://localhost:3001/; then
          echo "✅ Homepage accessible"
        else
          echo "❌ Homepage not accessible"
          kill $SERVER_PID || true
          exit 1
        fi
        
        # Cleanup
        kill $SERVER_PID || true
        echo "✅ Basic application test completed successfully"
        
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.node-version }}
        path: |
          reports/
          test-results/
          test-optimizer-reports/
        retention-days: 7

  # Job 2: Extended Tests (only on PR to main branch)
  extended-tests:
    name: Extended Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    needs: test-application
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Install client dependencies
      run: |
        cd client
        npm ci
        
    - name: Build application
      run: npm run build
      
    - name: 🤖 Run Optimized Tests (Balanced Strategy)
      continue-on-error: true
      run: |
        echo "Attempting to run balanced optimization for PR validation..."
        if npm run optimizer:balanced; then
          echo "✅ Balanced optimization completed successfully"
        else
          echo "⚠️ Balanced optimization failed - continuing with standard validation"
        fi
        
    - name: 📊 Generate Test Optimization Report
      continue-on-error: true
      run: |
        echo "Attempting to generate optimization insights..."
        if npm run optimizer:stats; then
          echo "✅ Optimization stats generated successfully"
        else
          echo "⚠️ Could not generate optimization stats"
        fi
        
    - name: 🧪 Run Extended Cucumber Tests
      env:
        NODE_ENV: test
        PORT: 3002
        TEST_BASE_URL: http://localhost:3002
      run: |
        echo "Starting backend server for extended tests on port 3002..."
        npm start &
        SERVER_PID=$!
        echo $SERVER_PID > extended_test_server.pid
        
        # Wait for server to be ready
        echo "Waiting for server to be ready..."
        for i in {1..30}; do
          if curl -f http://localhost:3002/api/health; then
            echo "✅ Server is ready for extended testing!"
            break
          fi
          echo "Waiting for server... attempt $i/30"
          sleep 2
        done
        
        # Run extended Cucumber tests
        echo "Running extended Cucumber test suite for PR validation..."
        npm run test:full || TEST_FAILED=true
        
        # Stop test server
        if [ -f extended_test_server.pid ]; then
          EXTENDED_TEST_SERVER_PID=$(cat extended_test_server.pid)
          echo "Stopping extended test server with PID: $EXTENDED_TEST_SERVER_PID"
          kill $EXTENDED_TEST_SERVER_PID || true
          rm extended_test_server.pid
        fi
        
        # Check if tests failed
        if [ "$TEST_FAILED" = "true" ]; then
          echo "❌ Extended Cucumber tests failed"
          exit 1
        else
          echo "✅ Extended Cucumber tests completed successfully"
        fi
        
    - name: Upload test optimization reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-optimizer-reports-extended
        path: |
          reports/
          test-optimizer-reports/
          *.json
        retention-days: 7

  # Job 3: Security and Quality Checks
  security-checks:
    name: Security and Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run security audit
      run: npm audit --audit-level high
      
    - name: Check for outdated dependencies
      run: npm outdated || true
      
    - name: License compliance check
      run: |
        npx license-checker --summary || true