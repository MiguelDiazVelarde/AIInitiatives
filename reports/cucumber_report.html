window.CUCUMBER_MESSAGES = [{"meta":{"protocolVersion":"28.1.0","implementation":{"version":"12.2.0","name":"cucumber-js"},"cpu":{"name":"x64"},"os":{"name":"win32","version":"10.0.26100"},"runtime":{"name":"node.js","version":"24.2.0"}}},{"source":{"data":"# language: en\r\nFeature: User Authentication\r\n  As an application user\r\n  I want to be able to login and register\r\n  So that I can access the application functionalities\r\n\r\n  Background:\r\n    Given the application is running at \"http://localhost:3000\"\r\n\r\n  # REQ-AUTH-002: Username and email uniqueness validation\r\n  Scenario: Register with duplicate username\r\n    Given I am on the registration page\r\n    When I enter the user data:\r\n      | field     | value                    |\r\n      | username  | admin                    |\r\n      | email     | different@example.com    |\r\n      | password  | password                 |\r\n    And I click the auth button \"Register\"\r\n    Then I should see an error message containing \"Username already exists\"\r\n\r\n  # REQ-AUTH-004: Registration validation feedback\r\n  Scenario: Registration validation with empty fields\r\n    Given I am on the registration page\r\n    When I submit the registration form with empty fields\r\n    Then I should see validation error messages\r\n    And the form should not be submitted\r\n\r\n  # REQ-AUTH-004: Email format validation\r\n  Scenario: Registration with invalid email format\r\n    Given I am on the registration page\r\n    When I enter invalid email format \"invalid-email\"\r\n    And I fill other required fields\r\n    Then I should see an email validation error\r\n    And registration should not proceed\r\n\r\n  # REQ-AUTH-008: Session maintenance across refreshes\r\n  Scenario: Session persistence after page refresh\r\n    Given I am authenticated as \"admin\"\r\n    When I refresh the browser page\r\n    Then I should remain logged in\r\n    And still have access to the dashboard\r\n\r\n  # REQ-AUTH-013: Session data clearing on logout\r\n  Scenario: Session data cleanup on logout\r\n    Given I am authenticated as \"admin\"\r\n    When I logout\r\n    Then my session data should be cleared\r\n    And I should not be able to access protected resources\r\n\r\n  # REQ-AUTH-014: Authentication status check\r\n  Scenario: Authentication status verification\r\n    Given I am authenticated as \"admin\"\r\n    When I check my authentication status\r\n    Then the system should confirm I am authenticated\r\n    And return my user information\r\n\r\n  # REQ-AUTH-009: Clear error messages for invalid credentials\r\n  Scenario: Login error messaging\r\n    Given I am on the login page\r\n    When I enter invalid credentials\r\n    Then I should see a clear error message\r\n    And the message should not reveal specific failure reasons\r\n\r\n  # REQ-AUTH-010: Redirect authenticated users to dashboard\r\n  Scenario: Automatic redirect after successful login\r\n    Given I am on the login page\r\n    When I login with valid credentials\r\n    Then I should be automatically redirected to the dashboard\r\n    And see the dashboard content immediately\r\n\r\n  # REQ-AUTH-015: Protected endpoints require authentication\r\n  Scenario: Protected resource access control\r\n    Given I am not authenticated\r\n    When I try to access protected API endpoints\r\n    Then access should be denied\r\n    And I should receive unauthorized error responses\r\n\r\n  # REQ-AUTH-005: Automatic login after successful registration\r\n  Scenario: Auto-login after registration\r\n    Given I am on the registration page\r\n    When I successfully register a new user\r\n    Then I should be automatically logged in\r\n    And redirected to the dashboard without additional login steps\r\n\r\n  # REQ-AUTH-011: Session maintenance\r\n  Scenario: Session management during navigation\r\n    Given I am authenticated as \"admin\"\r\n    When I navigate between different pages\r\n    Then my authentication should be maintained\r\n    And I should not be asked to login again\r\n\r\n  # REQ-AUTH-012: Secure logout functionality\r\n  Scenario: Secure logout process\r\n    Given I am authenticated as \"admin\"\r\n    When I initiate logout\r\n    Then my session should be securely terminated\r\n    And all authentication tokens should be invalidated\r\n      | email     | different@example.com    |\r\n      | password  | newpassword123          |\r\n    And I click the auth button \"Register\"\r\n    Then I should see an error message \"User already exists\"\r\n\r\n  # REQ-AUTH-004: Registration validation feedback\r\n  Scenario: Register with missing required fields\r\n    Given I am on the registration page\r\n    When I enter the user data:\r\n      | field     | value      |\r\n      | username  |            |\r\n      | email     |            |\r\n      | password  |            |\r\n    And I click the auth button \"Register\"\r\n    Then I should see validation error messages for required fields\r\n\r\n  # REQ-AUTH-004: Email format validation\r\n  Scenario: Register with invalid email format\r\n    Given I am on the registration page\r\n    When I enter the user data:\r\n      | field     | value          |\r\n      | username  | testuser       |\r\n      | email     | invalid-email  |\r\n      | password  | password123    |\r\n    And I click the auth button \"Register\"\r\n    Then I should see an error message about invalid email format\r\n\r\n  # REQ-AUTH-008: Session maintenance across refreshes\r\n  Scenario: Session persistence after browser refresh\r\n    Given I am authenticated as \"admin\"\r\n    When I refresh the browser\r\n    Then I should remain authenticated\r\n    And I should still be on the dashboard\r\n\r\n  # REQ-AUTH-013: Session data clearing on logout\r\n  Scenario: Session data cleared after logout\r\n    Given I am authenticated as \"admin\"\r\n    When I logout\r\n    And I try to access the dashboard directly\r\n    Then I should be redirected to the login page\r\n    And my session data should be cleared\r\n\r\n  # REQ-AUTH-014: Authentication status check\r\n  Scenario: Check authentication status via API\r\n    Given I am authenticated as \"admin\"\r\n    When I check my authentication status\r\n    Then the API should confirm I am authenticated\r\n    And it should return my user information\r\n\r\n  # REQ-AUTH-009: Clear error messages for invalid credentials\r\n  Scenario: Login with empty credentials\r\n    Given I am on the login page\r\n    When I enter username \"\" and password \"\"\r\n    And I click the auth button \"Login\"\r\n    Then I should see an error message about required fields\r\n\r\n  # REQ-AUTH-010: Redirect authenticated users to dashboard\r\n  Scenario: Already authenticated user visits login page\r\n    Given I am authenticated as \"admin\"\r\n    When I try to visit the login page directly\r\n    Then I should be redirected to the dashboard\r\n\r\n  # REQ-AUTH-015: Protected endpoints require authentication\r\n  Scenario: Access protected API endpoint without authentication\r\n    Given I am not authenticated\r\n    When I try to access the products API directly\r\n    Then I should receive an unauthorized error\r\n    And the API should return a 401 status code\r\n\r\n  # REQ-AUTH-005: Automatic login after successful registration\r\n  Scenario: Automatic login after registration\r\n    Given I am on the registration page\r\n    When I enter the user data:\r\n      | field     | value                     |\r\n      | username  | autouser                  |\r\n      | email     | autouser@example.com      |\r\n      | password  | autopassword123          |\r\n    And I click the auth button \"Register\"\r\n    Then I should be automatically logged in\r\n    And I should be redirected to the dashboard\r\n    And I should see the message \"Dashboard - Welcome autouser\"\r\n\r\n  # REQ-AUTH-011: Session maintenance\r\n  Scenario: Session maintained during navigation\r\n    Given I am authenticated as \"admin\"\r\n    When I navigate between different pages\r\n    Then my session should remain active\r\n    And I should not need to login again\r\n\r\n  # REQ-AUTH-012: Secure logout functionality\r\n  Scenario: Secure logout process\r\n    Given I am authenticated as \"admin\"\r\n    When I click the \"Logout\" button\r\n    Then my session should be destroyed on the server\r\n    And I should be logged out completely\r\n    And any sensitive data should be cleared from the client","uri":"tests\\features\\functional-requirements\\authentication\\authentication.feature","mediaType":"text/x.cucumber.gherkin+plain"}},{"gherkinDocument":{"feature":{"tags":[],"location":{"line":2,"column":1},"language":"en","keyword":"Feature","name":"User Authentication","description":"  As an application user\n  I want to be able to login and register\n  So that I can access the application functionalities","children":[{"background":{"id":"c8727097-2e17-49ac-a1e9-43fd8a9708ee","location":{"line":7,"column":3},"keyword":"Background","name":"","description":"","steps":[{"id":"603638e4-aa1a-40cd-a975-88c15ae05eec","location":{"line":8,"column":5},"keyword":"Given ","keywordType":"Context","text":"the application is running at \"http://localhost:3000\""}]}},{"scenario":{"id":"f8297c7b-ff5f-4a35-8e28-5764d9df9a74","tags":[],"location":{"line":11,"column":3},"keyword":"Scenario","name":"Register with duplicate username","description":"","steps":[{"id":"29998b57-5927-491d-a7e3-ed74921e90bc","location":{"line":12,"column":5},"keyword":"Given ","keywordType":"Context","text":"I am on the registration page"},{"id":"17020dbf-2c0c-4616-843a-339d42e33bae","location":{"line":13,"column":5},"keyword":"When ","keywordType":"Action","text":"I enter the user data:","dataTable":{"location":{"line":14,"column":7},"rows":[{"id":"4182732a-9507-44e6-8b98-309ac77c5a13","location":{"line":14,"column":7},"cells":[{"location":{"line":14,"column":9},"value":"field"},{"location ":"my session should be destroyed on the server","type":"Outcome","astNodeIds":["e9b3b2ce-1936-4a37-aeed-804836060f9e"]},{"id":"b4ee7a56-77cd-491a-a6f4-aa721c9838b8","text":"I should be logged out completely","type":"Outcome","astNodeIds":["4b60dd79-2400-4343-9818-a6bd1c308409"]},{"id":"4120d10d-05c1-4069-a51f-b94527d569e6","text":"any sensitive data should be cleared from the client","type":"Outcome","astNodeIds":["1fc86452-984b-4a2e-a222-1238266fe204"]}]}},{"source":{"data":"# language: en\r\nFeature: Product Management\r\n  As an authenticated user\r\n  I want to manage products\r\n  So that I can maintain my product catalog\r\n\r\n  Background:\r\n    Given I am authenticated as \"admin\"\r\n\r\n  # REQ-PROD-002: Product field validation\r\n  Scenario: Add product with all required fields\r\n    Given I am on the dashboard\r\n    When I complete the product form with:\r\n      | field       | value                    |\r\n      | name        | Gaming Laptop            |\r\n      | description | High-performance laptop  |\r\n      | price       | 1299.99                  |\r\n      | category    | electronics              |\r\n      | stock       | 25                       |\r\n    And I submit the product form\r\n    Then the product should be created successfully\r\n    And should appear in the product list\r\n\r\n  # REQ-PROD-003: Price validation (positive numbers)\r\n  Scenario: Add product with invalid price\r\n    Given I am on the dashboard\r\n    When I complete the product form with:\r\n      | field       | value           |\r\n      | name        | Invalid Product |\r\n      | description | Test product    |\r\n      | price       | -10.99          |\r\n      | category    | electronics     |\r\n      | stock       | 5               |\r\n    And I submit the product form\r\n    Then I should see a price validation error\r\n    And the product should not be created\r\n\r\n  # REQ-PROD-003: Stock validation (non-negative integer)\r\n  Scenario: Add product with invalid stock\r\n    Given I am on the dashboard\r\n    When I complete the product form with:\r\n      | field       | value           |\r\n      | name        | Invalid Stock   |\r\n      | description | Test product    |\r\n      | price       | 29.99           |\r\n      | category    | electronics     |\r\n      | stock       | -5              |\r\n    And I submit the product form\r\n    Then I should see a stock validation error\r\n    And the product should not be created\r\n\r\n  # REQ-PROD-005: Unique ID assignment\r\n  Scenario: Multiple products have unique IDs\r\n    Given I have created multiple products\r\n    When I check the product identifiers\r\n    Then each product should have a unique ID\r\n    And no ID collisions should exist\r\n\r\n  # REQ-PROD-006: Creation timestamp and creator tracking\r\n  Scenario: Product creation metadata\r\n    Given I am on the dashboard\r\n    When I create a new product\r\n    Then the product should include creation timestamp\r\n    And should record the creator information\r\n\r\n  # REQ-PROD-008: Product information display\r\n  Scenario: Product display includes all information\r\n    Given I have products in the system\r\n    When I view the product list\r\n    Then each product should display name, description, price, category, and stock\r\n    And all information should be clearly formatted\r\n\r\n  # REQ-PROD-009: Responsive grid layout\r\n  Scenario: Product list responsive layout\r\n    Given I have multiple products in the system\r\n    When I view the product list on different screen sizes\r\n    Then products should be displayed in a responsive grid\r\n    And layout should adapt to screen dimensions\r\n\r\n  # REQ-PROD-010: Empty state message\r\n  Scenario: Empty product list display\r\n    Given I have no products in the system\r\n    When I view the product list\r\n    Then I should see an appropriate empty state message\r\n    And guidance on how to add the first product\r\n\r\n  # REQ-PROD-011: Real-time list updates\r\n  Scenario: Product list updates after operations\r\n    Given I am viewing the product list\r\n    When I add or delete a product\r\n    Then the list should update immediately\r\n    And reflect the changes without requiring a page refresh\r\n\r\n  # REQ-PROD-013: Delete confirmation\r\n  Scenario: Product deletion requires confirmation\r\n    Given I have products in the system\r\n    When I attempt to delete a product\r\n    Then I should see a confirmation dialog\r\n    And be able to confirm or cancel the deletion\r\n\r\n  # REQ-PROD-016: Graceful deletion error handling\r\n  Scenario: Handle deletion errors gracefully\r\n    Given I have products in the system\r\n    When deletion fails due to an error\r\n    Then I should see an appropriate error message\r\n    And the product should remain in the list\r\n\r\n  # REQ-PROD-004: Form validation feedback\r\n  Scenario: Comprehensive form validation feedback\r\n    Given I am on the dashboard\r\n    When I submit the product form with missing or invalid data\r\n    Then I should see specific validation errors for each field\r\n    And clear guidance on how to correct the errors\r\n    And the form should prevent submission until valid\r\n\r\n  # REQ-PROD-007: Product counter display\r\n  Scenario: Product counter shows correct count\r\n    Given I have products in the system\r\n    When I view the dashboard\r\n    Then the product counter should show the correct number of products\r\n    And update when products are added or removed\r\n    Examples:\r\n      | products_count | expected_display |\r\n      | 0             | \"0 products\"     |\r\n      | 1             | \"1 product\"      |\r\n      | 5             | \"5 products\"     |\r\n\r\n  # REQ-PROD-015: Successful deletion updates display\r\n  Scenario: Product removal from display after deletion\r\n    Given I have a product in the system\r\n    When I successfully delete the product\r\n    Then it should be immediately removed from the display\r\n    And the product count should be updated","uri":"tests\\features\\functional-requirements\\product-management\\products.feature","mediaType":"text/x.cucumber.gherkin+plain"}},{"gherkinDocument":{"feature":{"tags":[],"location":{"line":2,"column":1},"language":"en","keyword":"Feature","name":"Product Management","description":"  As an authenticated user\n  I want to manage products\n  So that I can maintain my product catalog","children":[{"background":{"id":"78086d4b-ab60-4bca-942f-a7f28bd0fd26","location":{"line":7,"column":3},"keyword":"Background","name":"","description":"","steps":[{"id":"ef77cec9-0dfa-4ca0-8b32-bdb3b6420ed6","location":{"line":8,"column":5},"keyword":"Given ","keywordType":"Context","text":"I am authenticated as \"admin\""}]}},{"scenario":{"id":"ec818f50-f200-4e0f-836f-b60b3fbf34e7","tags":[],"location":{"line":11,"column":3},"keyword":"Scenario","name":"Add product with all required fields","description":"","steps":[{"id":"a127fe86-0fdb-4043-ab0f-a164f43eb938","location":{"line":12,"column":5},"keyword":"Given ","keywordType":"Context","text":"I am on the dashboard"},{"id":"136c688f-9053-490f-9748-841735f1fa24","location":{"line":13,"column":5},"keyword":"When ","keywordType":"Action","text":"I complete the product form with:","dataTable":{"location":{"line":14,"column":7},"rows":[{"id":"06131660-7d09-41b8-9530-64ef0e1f87b3","location":{"line":14,"column":7},"cells":[{"location":{"line":14,"column":9},"value":"field"},{"location":{"line":14,"column":23},"value":"value"}]},{"id":"69a9d764-7894-46c6-ad39-f54afe8e4873","location":{"line":15,"column":7},"cells":[{"location":{"line":15,"column":9},"value":"name"},{"location":{"line":15,"column":23},"value":"Gaming Laptop"}]},{"id":"8971ad51-ed78-4905-9f02-fff4b311c863","location":{"line":16,"column":7},"cells":[{"location":{"line":16,"column":9},"value":"description"},{"location":{"line":16,"column":23},"value":"High-performance laptop"}]},{"id":"224390e7-a79d-4c6c- n","astNodeIds":["cd8743ca-1298-4e68-973d-ab24e2d1b81a","7559e838-04a5-424b-aa8b-55242da0159b"]},{"id":"7520c784-361a-4bd5-97b0-e58176de3522","text":"the product counter should show the correct number of products","type":"Outcome","astNodeIds":["26652ca9-07d9-457c-aaaf-b34d5115226c","7559e838-04a5-424b-aa8b-55242da0159b"]},{"id":"f1b45360-edda-42d5-9b64-a68cfaa6349c","text":"update when products are added or removed","type":"Outcome","astNodeIds":["5e81c67b-ffbf-427b-b395-4b4dff391830","7559e838-04a5-424b-aa8b-55242da0159b"]}],"tags":[]}},{"pickle":{"id":"b9fd33cf-6d9b-4f73-b036-493d2fe4027f","uri":"tests\\features\\functional-requirements\\product-management\\products.feature","astNodeIds":["993f142d-7c4c-4975-8955-ff3a27a20dc2"],"tags":[],"name":"Product removal from display after deletion","language":"en","steps":[{"id":"95be39fd-f0f9-4287-a847-189779cd3365","text":"I am authenticated as \"admin\"","type":"Context","astNodeIds":["ef77cec9-0dfa-4ca0-8b32-bdb3b6420ed6"]},{"id":"69100089-0be6-4fb6-b0b7-c03ea6de5a6a","text":"I have a product in the system","type":"Context","astNodeIds":["455aa7c7-38de-42cd-8d8a-6e578625b4c1"]},{"id":"d6345de4-3bb5-438e-895e-052c3d2dfa89","text":"I successfully delete the product","type":"Action","astNodeIds":["7773dce4-0447-4750-a177-1ceda944e19e"]},{"id":"59dc72bb-23c3-4e15-ba33-6df06d203a9e","text":"it should be immediately removed from the display","type":"Outcome","astNodeIds":["61762b14-aa26-4f1b-bcea-314f303d6ac1"]},{"id":"c5115afa-722e-4c1d-9cde-69212157e02b","text":"the product count should be updated","type":"Outcome","astNodeIds":["58e4ac98-ce67-4d83-a5d6-44801fb04b28"]}]}},{"source":{"data":"Feature: User Interface Navigation and Responsiveness\r\n\r\n  # REQ-UI-001: Intuitive navigation between login and registration\r\n  Scenario: Easy switching between auth forms\r\n    Given I am on the login page\r\n    When I click the register link\r\n    Then I should smoothly transition to the registration page\r\n    And the registration form should be clearly visible\r\n    When I click the login link\r\n    Then I should smoothly transition back to the login page\r\n    And the login form should be clearly visible\r\n\r\n  # REQ-UI-002: Appropriate redirection based on authentication\r\n  Scenario: Authenticated user redirection\r\n    Given I am authenticated as \"admin\"\r\n    When I try to visit the login page\r\n    Then I should be automatically redirected to the dashboard\r\n    And I should not see the login form\r\n\r\n  # REQ-UI-003: Clear visual indicators for current state\r\n  Scenario: Visual state indicators\r\n    Given I am on the login page\r\n    Then I should see clear indicators that I'm on the login page\r\n    When I switch to registration\r\n    Then I should see clear indicators that I'm on the registration page\r\n    When I am authenticated and on the dashboard\r\n    Then I should see clear indicators of my logged-in state\r\n    And I should see my username displayed\r\n\r\n  # REQ-UI-004: Accessible logout functionality\r\n  Scenario: Logout accessibility\r\n    Given I am authenticated as \"admin\"\r\n    When I am on the dashboard\r\n    Then I should see a clearly visible logout button\r\n    And the logout button should be easily accessible\r\n    When I click the logout button\r\n    Then I should be logged out immediately\r\n    And redirected to the login page\r\n\r\n  # REQ-UI-005: Responsive form layouts\r\n  Scenario: Form responsiveness across devices\r\n    Given I am on the login page\r\n    When I view the page on different screen sizes\r\n    Then the login form should adapt to the screen size\r\n    And all form elements should remain accessible\r\n    When I switch to registration page\r\n    Then the registration form should also be responsive\r\n    And maintain usability across all screen sizes\r\n\r\n  # REQ-UI-006: Form validation with user feedback\r\n  Scenario: Real-time form validation feedback\r\n    Given I am on the registration page\r\n    When I enter invalid data in form fields\r\n    Then I should see immediate validation feedback\r\n    And the feedback should be clear and helpful\r\n    When I correct the invalid data\r\n    Then the validation feedback should update accordingly\r\n\r\n  # REQ-UI-007: Form submission state management\r\n  Scenario: Form submission states\r\n    Given I am on the login page\r\n    When I submit the login form\r\n    Then the submit button should be disabled during processing\r\n    And I should see a loading indicator\r\n    When the login completes\r\n    Then the form should return to normal state\r\n\r\n  # REQ-UI-008: Loading indicators for async operations\r\n  Scenario: Loading indicators throughout the application\r\n    Given I am logging in\r\n    When the authentication is in progress\r\n    Then I should see appropriate loading indicators\r\n    When I am loading products on the dashboard\r\n    Then I should see loading feedback\r\n    When I am creating a new product\r\n    Then I should see submission progress indicators\r\n\r\n  # REQ-UI-009: Form data clearing after submission\r\n  Scenario: Form reset after successful operations\r\n    Given I am on the dashboard\r\n    When I fill out the product form completely\r\n    And I submit it successfully\r\n    Then all form fields should be cleared automatically\r\n    And the form should be ready for new input\r\n\r\n  # REQ-UI-010 & REQ-UI-011: Responsive design across devices\r\n  Scenario: Cross-device compatibility\r\n    Given I am using the application\r\n    When I access it from a desktop browser\r\n    Then all features should work correctly\r\n    When I access it from a tablet\r\n    Then the interface should adapt appropriately\r\n    And maintain full functionality\r\n    When I access it from a mobile device\r\n    Then the interface should be mobile-friendly\r\n    And all actions should remain accessible\r\n\r\n  # REQ-UI-012: Optimal layout adaptation\r\n  Scenario: Layout optimization for different screens\r\n    Given I am on the dashboard\r\n    When I view it on a large desktop screen\r\n    Then the product grid should utilize the available space efficiently\r\n    When I view it on a smaller laptop screen\r\n    Then the layout should compact appropriately\r\n    When I view it on a mobile screen\r\n    Then the products should stack vertically for easy scrolling","uri":"tests\\features\\functional-requirements\\user-interface\\navigation.feature","mediaType":"text/x.cucumber.gherkin+plain"}},{"gherkinDocument":{"feature":{"tags":[],"location":{"line":1,"column":1},"language":"en","keyword":"Feature","name":"User Interface Navigation and Responsiveness","description":"","children":[{"scenario":{"id":"33540d86-c1b5-4f6a-acc3-438ecb7a835c","tags":[],"location":{"line":4,"column":3},"keyword":"Scenario","name":"Easy switching between auth forms","description":"","steps":[{"id":"aa975ed4-7f83-40d3-aca3-5534807376dd","location":{"line":5,"column":5},"keyword":"Given ","keywordType":"Context","text":"I am on the login page"},{"id":"3929ef64-2ef0-491e-8785-e495b2331a2a","location":{"line":6,"column":5},"keyword":"When ","keywordType":"Action","text":"I click the register link"},{"id":"4f860a0e-529d-4994-9bc5-6b6d840ed456","location":{"line":7,"column":5},"keyword":"Then ","keywordType":"Outcome","text":"I should smoothly transition to the registration page"},{"id":"9f4adefc-082f-4446-a850-54b1a034b536","location":{"line":8,"column":5},"keyword":"And ","keywordType":"Conjunction","text":"the registration form should be clearly visible"},{"id":"62d38b09-d3ce-4948-86cc-83f9916d884d","location":{"line":9,"column":5},"keyword":"When ","keywordType":"Action","text":"I click the login link"},{"id":"48040ccb-a479-4d35-aa62-ece9d30a174b","location":{"line":10,"column":5},"keyword":"Then ","keywordType":"Outcome","text":"I should smoothly transition back to the login page"},{"id":"dc111f75-6d3c-4480-a2ef-7b83b06b73c7","location":{"line":11,"colu \r\n    And product lists should appear promptly\r\n    And the interface should be usable immediately\r\n\r\n  # REQ-PERF-003: Concurrent user session handling\r\n  Scenario: Performance with multiple concurrent users\r\n    Given multiple users are accessing the system simultaneously\r\n    When they perform various operations at the same time\r\n    Then the system should maintain good performance for all users\r\n    And response times should remain acceptable\r\n    And no user should experience significant delays\r\n\r\n  # REQ-PERF-004: API response optimization\r\n  Scenario: Optimized API responses for minimal data transfer\r\n    Given I am making API requests\r\n    When I request product data or user information\r\n    Then the API should return only necessary data\r\n    And response sizes should be optimized\r\n    And unnecessary data should not be transmitted","uri":"tests\\features\\non-functional-requirements\\performance\\performance.feature","mediaType":"text/x.cucumber.gherkin+plain"}},{"gherkinDocument":{"feature":{"tags":[],"location":{"line":2,"column":1},"language":"en","keyword":"Feature","name":"Performance Requirements","description":"  As a user of the application\n  I want the system to perform efficiently and responsively\n  So that I can complete tasks quickly without delays","children":[{"background":{"id":"57004db8-ae0d-4fa6-a3d0-22677fbbeb8f","location":{"line":7,"column":3},"keyword":"Background","name":"","description":"","steps":[{"id":"11fccde9-d1fb-4215-abfe-0798e2d56a5f","location":{"line":8,"column":5},"keyword":"Given ","keywordType":"Context","text":"the application is running"},{"id":"26651b20-923a-45e1-bab3-f053bb304bc6","location":{"line":9,"column":5},"keyword":"And ","keywordType":"Conjunction","text":"I have access to the system"}]}},{"scenario":{"id":"e1155fce-bd1e-4650-922c-127197a7b481","tags":[],"location":{"line":12,"column":3},"keyword":"Scenario","name":"Acceptable response times for standard operations","desc n I am entering data in any form field\r\n    When I try to inject JavaScript code\r\n    Then the code should be sanitized or escaped\r\n    And not executed in the browser\r\n    And other users should not be affected\r\n\r\n  Scenario: CSRF protection measures\r\n    Given I am performing state-changing operations\r\n    When requests are made to the server\r\n    Then appropriate CSRF protection should be in place\r\n    And unauthorized requests should be blocked\r\n\r\n  # REQ-SEC-005: Authentication enforcement\r\n  Scenario: Comprehensive authentication enforcement\r\n    Given I am not authenticated\r\n    When I try to access any protected resource:\r\n      | endpoint           |\r\n      | /api/products      |\r\n      | /api/products/123  |\r\n      | /dashboard         |\r\n    Then each request should be rejected\r\n    And I should receive unauthorized error responses\r\n    And be redirected to login when appropriate","uri":"tests\\features\\non-functional-requirements\\security\\security.feature","mediaType":"text/x.cucumber.gherkin+plain"}},{"gherkinDocument":{"feature":{"tags":[],"location":{"line":2,"column":1},"language":"en","keyword":"Feature","name":"Security Requirements","description":"  As a system administrator\n  I want to ensure the application is secure\n  So that user data and system integrity are protected","children":[{"background":{"id":"13e1e2bb-7b65-4617-a49d-ee706421b1ff","location":{"line":7,"column":3},"keyword":"Background","name":"","description":"","steps":[{"id":"cee03e4d-97ac-4023-abbe-d4636f2023d0","location":{"line":8,"column":5},"keyword":"Given ","keywordType":"Context","text":"the application is running at \"http://localhost:3000\""}]}},{"scenario":{"id":"00b0f570-6147-4300-8ec4-673afec75376","tags":[],"location":{"line":11,"column":3},"keyword":"Scenario","name":"Password encryption verification","description":"","steps":[{"id":"07421f37-a9d5-466c-9257-a908511050cd","location":{"line":12,"column":5},"keyword":"Give lowing endpoints should be available:\r\n      | method | endpoint              | description        |\r\n      | GET    | /api/products         | Get all products   |\r\n      | POST   | /api/products         | Create product     |\r\n      | GET    | /api/products/:id     | Get product by ID  |\r\n      | DELETE | /api/products/:id     | Delete product     |\r\n\r\n  # REQ-API-003: Consistent JSON response format\r\n  Scenario: Consistent API response structure\r\n    Given I am making various API requests\r\n    When I call any API endpoint\r\n    Then all responses should follow a consistent JSON format\r\n    And include appropriate status information\r\n    And provide consistent error messaging structure\r\n\r\n  # REQ-API-004: Proper HTTP status codes\r\n  Scenario: Correct HTTP status codes for different scenarios\r\n    Given I am testing various API scenarios\r\n    When I make requests with different conditions:\r\n      | scenario                    | expected_status |\r\n      | successful login            | 200             |\r\n      | successful registration     | 201             |\r\n      | invalid credentials         | 401             |\r\n      | missing required fields     | 400             |\r\n      | resource not found          | 404             |\r\n      | unauthorized access         | 401             |\r\n      | server error               | 500             |\r\n    Then each should return the appropriate HTTP status code","uri":"tests\\features\\technical-requirements\\api\\api-technical.feature","mediaType":"text/x.cucumber.gherkin+plain"}},{"gherkinDocument":{"feature":{"tags":[],"location":{"line":2,"column":1},"language":"en","keyword":"Feature","name":"API Technical Requirements","description":"  As a developer or system integrator\n  I want the API to be well-designed and technically sound\n  So that it can be integrated and maintained effectively","children":[{"background":{"id":"91428ebb-5b34-4862-914c-3bcfee034dc0","location":{"l
